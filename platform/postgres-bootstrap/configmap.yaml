apiVersion: v1
kind: ConfigMap
metadata:
  name: vvp-postgres-bootstrap
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  POSTGRES_HOST: postgres.example.internal
  POSTGRES_PORT: "5432"
  POSTGRES_MAINTENANCE_DATABASE: postgres
  POSTGRES_ADMIN_USER: replace-with-admin-user
  POSTGRES_SSLMODE: require
  POSTGRES_CONNECT_RETRIES: "30"
  POSTGRES_CONNECT_RETRY_SECONDS: "5"
  VVP_NAME: replace-with-vvp-instance-name
  VVP_POSTGRES_ROLE: replace-with-vvp-runtime-role
