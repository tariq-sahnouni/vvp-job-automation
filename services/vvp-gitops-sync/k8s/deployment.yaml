apiVersion: apps/v1
kind: Deployment
metadata:
  name: vvp-gitops-sync
  namespace: vvp
  labels:
    app: vvp-gitops-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vvp-gitops-sync
  template:
    metadata:
      labels:
        app: vvp-gitops-sync
    spec:
      containers:
        - name: vvp-gitops-sync
          image: registry.example.com/platform/vvp-gitops-sync:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GIT_REPO_URL
              value: https://git.example.com/team/vvp-deployments.git
            - name: GIT_BRANCH
              value: main
            - name: GIT_PATH
              value: deployments
            - name: SYNC_INTERVAL_SECONDS
              value: "60"
            - name: VVP_API_BASE_URL
              value: http://vvp-ververica-platform.vvp.svc.cluster.local
            - name: VVP_API_NAMESPACE
              value: default
            - name: VVP_AUTH_PROVIDER
              value: none
            - name: VVP_GITOPS_PRUNE_ENABLED
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
