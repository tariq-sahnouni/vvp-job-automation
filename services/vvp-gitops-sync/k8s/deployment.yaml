apiVersion: apps/v1
kind: Deployment
metadata:
  name: vvp-gitops-sync
  labels:
    app: vvp-gitops-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vvp-gitops-sync
  template:
    metadata:
      labels:
        app: vvp-gitops-sync
    spec:
      containers:
        - name: vvp-gitops-sync
          image: registry.example.internal/project/vvp-gitops-sync:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/vvp-gitops-sync/config.yaml
          env:
            - name: HOME
              value: /git-auth
            - name: VVP_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vvp-gitops-sync-vvp-token
                  key: token
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /etc/vvp-gitops-sync
              readOnly: true
            - name: git-credentials
              mountPath: /git-auth
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: vvp-gitops-sync
        - name: git-credentials
          secret:
            secretName: vvp-gitops-sync-git
            optional: true
            defaultMode: 0400
        - name: data
          emptyDir: {}
