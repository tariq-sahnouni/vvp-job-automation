apiVersion: v1
kind: Deployment
metadata:
  name: simple-python-flink-job
spec:
  state: RUNNING
  deploymentTargetName: ${VVP_DEPLOYMENT_TARGET_NAME}
  template:
    spec:
      artifact:
        kind: PYTHON
        pythonArtifactUri: ${S3_ARTIFACT_URI_PREFIX}/simple_pyflink_job.py
      flinkConfiguration:
        state.checkpoints.dir: ${S3_CHECKPOINT_URI_PREFIX}/simple-python-flink-job
        state.savepoints.dir: ${S3_SAVEPOINT_URI_PREFIX}/simple-python-flink-job
