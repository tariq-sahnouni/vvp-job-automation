apiVersion: v1
kind: Deployment
metadata:
  name: simple-java-flink-job-session
  labels:
    managed-by: flink-deployment-sync
spec:
  state: RUNNING
  deploymentTargetName: ${VVP_DEPLOYMENT_TARGET_NAME}
  sessionClusterName: simple-session-cluster
  template:
    spec:
      artifact:
        kind: JAR
        jarUri: ${S3_ARTIFACT_URI_PREFIX}/simple-java-flink-job.jar
        entryClass: com.example.flinkautomation.SimpleFlinkJob
      parallelism: 1
      flinkConfiguration:
        state.checkpoints.dir: ${S3_CHECKPOINT_URI_PREFIX}/simple-java-flink-job-session
        state.savepoints.dir: ${S3_SAVEPOINT_URI_PREFIX}/simple-java-flink-job-session
